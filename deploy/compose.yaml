# The demo on one VM (§17.4): the app, and Caddy in front of it. The secrets
# come from deploy/.env, on the VM only (see .env.example).
#
#   docker compose -f deploy/compose.yaml up -d --build
#   docker compose -f deploy/compose.yaml logs -f app

services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      # The database and the uploads (§17.3), then the hourly copies (§17.5)
      - data:/data
      - backups:/backups
    # Reached through Caddy only
    expose:
      - '8000'

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?le domaine de la démo, dans deploy/.env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The certificates: kept across restarts, Let's Encrypt limits renewals
      - caddy:/data

volumes:
  data:
  backups:
  caddy:
