# PAM-537 · Builds the production image and publishes it to the GitHub
# registry, for the machine to pull (§17.4, docs/deploiement.md). Runs once
# the CI passed on master, or by hand from the Actions tab: an image is
# never published from code that failed its checks.
name: publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit the CI checked, not whatever master is now
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # The Systalink VM is x86-64
          platforms: linux/amd64
          push: true
          # The name of a registry image is lower case
          tags: |
            ghcr.io/mirak29/pamoja:latest
            ghcr.io/mirak29/pamoja:${{ github.event.workflow_run.head_sha || github.sha }}
          # The build stage (Deno, the packages) is reused between runs
          cache-from: type=gha
          cache-to: type=gha,mode=max
