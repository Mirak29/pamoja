# PAM-117 · Format, lint, types and tests on each PR and on master.
# The tests fake every GitHub call and use a temporary media folder: no secret.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.7
          cache: true
          # No deno.lock ("lock": false): the cache follows deno.json.
          cache-hash: ${{ hashFiles('deno.json') }}

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Types
        run: deno check api web deploy *.ts

      - name: Tests
        run: deno task test
